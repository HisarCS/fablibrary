<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mission Control">
<meta name="theme-color" content="#0a0f24">
<title>Mission Control - Welcome Space game</title>
<style>
:root{--bg:#0a0f24;--panel:#141b3a;--panel2:#1c2550;--line:#2c376e;--text:#f2f5ff;--muted:#a9b3d9;--ok:#5DCAA5;--warn:#EF9F27;--bad:#E24B4A;--blue:#378ADD}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:19px;line-height:1.4;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:1000px;margin:0 auto;padding:12px 16px 28px}
header{display:flex;align-items:center;gap:12px;min-height:60px}
header h1{font-size:22px;margin:0;flex:1}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;color:var(--warn);white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
.btn{min-height:56px;padding:12px 22px;border-radius:16px;border:2px solid var(--line);background:var(--panel2);font-weight:700;font-size:19px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);border-color:#7fb4ee;color:#fff}
.btn.ok{background:#17624c;border-color:var(--ok)}
.btn.small{min-height:48px;padding:8px 16px;font-size:17px}
.btn[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.botRow{display:flex;gap:12px;align-items:center;margin:8px 0 14px}
.bot svg{width:64px;height:64px;flex:none}
.bubble{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:12px 16px;flex:1}
.levels{display:grid;grid-template-columns:1fr;gap:10px}
.lvl{display:flex;align-items:center;gap:12px;text-align:left;min-height:72px;padding:10px 14px;border-radius:16px;border:2px solid var(--line);background:var(--panel)}
.lvl:active{transform:scale(.98)}
.lvl .num{width:40px;height:40px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-weight:800;flex:none}
.lvl .lt{flex:1;display:flex;flex-direction:column}
.lvl small{color:var(--muted);font-size:15px}
.st{color:var(--warn);letter-spacing:2px;white-space:nowrap}
.progress{display:flex;gap:6px;margin:6px 0 12px}
.progress i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.progress i.on{background:var(--ok)}
.progress i.cur{background:var(--blue)}
svg{display:block;max-width:100%;height:auto}
.stagebox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px}
.machines{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.mach{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:16px;border:2px solid var(--line);background:var(--panel2);min-height:112px;font-weight:700;text-align:center;font-size:17px}
.mach.bad{border-color:var(--bad);animation:shake .4s}
.mach.good{border-color:var(--ok);background:#17624c}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:64px;margin-top:12px;padding:12px 16px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.fb.good{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.steps span{padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:15px;font-weight:700}
.steps span.on{background:var(--blue);color:#fff;border-color:#7fb4ee}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.opt{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);font-weight:700;padding:8px}
.opt.sel{border-color:var(--warn);background:#4a3a14}
.opt.bad{border-color:var(--bad)}.opt.good{border-color:var(--ok);background:#17624c}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{min-height:52px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);font-weight:700;display:flex;align-items:center;gap:8px}
.chip.sel{border-color:var(--ok);background:#17624c}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:inline-block}
.hit{fill:transparent;cursor:pointer}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.result{text-align:center;padding:24px 8px}
.result .big{font-size:48px;color:var(--warn);letter-spacing:6px}
label.f{display:block;color:var(--muted);font-size:16px;margin:8px 0 4px}
input[type=text]{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);color:var(--text);font-size:19px;padding:8px 14px;-webkit-user-select:text;user-select:text}
input[type=range]{width:100%;height:44px}
.meter{height:20px;border-radius:10px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.madein{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.madein div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:16px}
.madein b{display:block;font-size:22px;color:var(--ok)}
.tabslide{transition:transform .9s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="btn small" id="back" hidden>Menu</button>
    <h1 id="title">Mission Control</h1>
    <span class="pill" id="totalStars">0 / 18</span>
  </header>
  <main id="stage"></main>
</div>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var stage=$('#stage'),titleEl=$('#title'),starsEl=$('#totalStars'),backBtn=$('#back');
var WOOD='#E8CFA3',WS='#8A6A3C',GL='#B5D4F4',GLS='#185FA5';

/* ---------- progress (stars only, stored on this device) ---------- */
var KEY='fablib-welcome-space-v1',prog={};
try{prog=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){prog={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}}
function setStars(id,n){if((prog[id]||0)<n){prog[id]=n;save()}updateTotal()}
function updateTotal(){var t=0;LEVELS.forEach(function(l){t+=prog[l.id]||0});starsEl.textContent=t+' / '+(LEVELS.length*3)}
function doneCount(){var c=0;LEVELS.forEach(function(l){if(prog[l.id])c++});return c}
function starsStr(n){return '\u2605'.repeat(n)+'\u2606'.repeat(3-n)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- shared pieces ---------- */
function bot(msg){return '<div class="botRow"><div class="bot"><svg viewBox="0 0 64 64" role="img" aria-label="Fab Bot"><line x1="32" y1="4" x2="32" y2="12" stroke="#EF9F27" stroke-width="3"/><circle cx="32" cy="5" r="3.5" fill="#EF9F27"/><rect x="10" y="12" width="44" height="34" rx="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="2"/><circle cx="24" cy="29" r="5" fill="#0a0f24"/><circle cx="40" cy="29" r="5" fill="#0a0f24"/><circle cx="25.5" cy="27.5" r="1.6" fill="#fff"/><circle cx="41.5" cy="27.5" r="1.6" fill="#fff"/><rect x="20" y="50" width="24" height="10" rx="4" fill="#378ADD"/></svg></div><div class="bubble" id="botmsg">'+msg+'</div></div>'}
function say(m){var b=$('#botmsg');if(b)b.innerHTML=m}
function progress(n,cur){var h='<div class="progress">';for(var i=0;i<n;i++)h+='<i class="'+(i<cur?'on':i===cur?'cur':'')+'"></i>';return h+'</div>'}
function setView(t,isHome){titleEl.textContent=t;backBtn.hidden=!!isHome;window.scrollTo(0,0)}

/* ---------- machine + part icons ---------- */
function mIcon(id){
  var c={
    laser:'<rect x="6" y="34" width="44" height="14" rx="3" fill="#6b7280"/><rect x="24" y="22" width="8" height="12" fill="#9ca3af"/><line x1="28" y1="34" x2="28" y2="46" stroke="#E24B4A" stroke-width="3"/><circle cx="28" cy="46" r="3" fill="#E24B4A"/><rect x="10" y="48" width="36" height="4" fill="#E8CFA3"/>',
    print3d:'<rect x="8" y="6" width="40" height="44" rx="3" fill="none" stroke="#9ca3af" stroke-width="3"/><rect x="18" y="14" width="20" height="8" rx="2" fill="#378ADD"/><path d="M26 22h4l-2 6z" fill="#EF9F27"/><rect x="16" y="40" width="24" height="6" fill="#B5D4F4"/>',
    gs24:'<rect x="6" y="38" width="44" height="10" rx="2" fill="#D85A30"/><path d="M28 8l8 24H20z" fill="#d1d5db" stroke="#6b7280" stroke-width="1.5"/><rect x="24" y="6" width="8" height="6" fill="#6b7280"/>',
    bn20:'<rect x="6" y="22" width="44" height="22" rx="4" fill="#6b7280"/><rect x="14" y="8" width="28" height="16" fill="#fff"/><rect x="14" y="40" width="28" height="12" fill="#fff"/><polygon points="28,42 30,46 34,46 31,49 32,53 28,50 24,53 25,49 22,46 26,46" fill="#EF9F27"/>',
    bench:'<rect x="6" y="38" width="44" height="12" rx="3" fill="#8A6A3C"/><circle cx="18" cy="26" r="6" fill="#fff" stroke="#9ca3af" stroke-width="2"/><rect x="28" y="18" width="18" height="14" rx="3" fill="#D3D1C7"/><line x1="18" y1="32" x2="18" y2="38" stroke="#9ca3af" stroke-width="2"/>'
  }[id];
  return '<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">'+c+'</svg>';
}
function pIcon(id){
  var c={
    base:'<circle cx="32" cy="32" r="26" fill="'+WOOD+'" stroke="'+WS+'" stroke-width="2"/><rect x="29" y="8" width="6" height="14" fill="#fff" stroke="'+WS+'"/>',
    panels:'<path d="M20 56L24 8H40L44 56Z" fill="'+WOOD+'" stroke="'+WS+'" stroke-width="2"/><circle cx="32" cy="24" r="6" fill="'+GL+'" stroke="'+WS+'"/>',
    wings:'<path d="M14 10H34L50 54H14Z" fill="#378ADD" stroke="'+WS+'" stroke-width="2"/>',
    nose:'<path d="M16 54Q18 20 32 6Q46 20 48 54Z" fill="'+GL+'" fill-opacity=".85" stroke="'+GLS+'" stroke-width="2"/>',
    diffuser:'<path d="M14 12H50L56 52H8Z" fill="'+GL+'" fill-opacity=".7" stroke="'+GLS+'" stroke-width="2"/>',
    rails:'<rect x="6" y="20" width="52" height="8" fill="#D85A30"/><rect x="6" y="38" width="52" height="8" fill="#D85A30"/>',
    stickers:'<polygon points="32,6 38,24 56,24 42,35 47,54 32,43 17,54 22,35 8,24 26,24" fill="#EF9F27"/>',
    led:'<circle cx="22" cy="26" r="10" fill="#fff" stroke="#9ca3af" stroke-width="2"/><line x1="18" y1="36" x2="18" y2="54" stroke="#9ca3af" stroke-width="3"/><line x1="26" y1="36" x2="26" y2="46" stroke="#9ca3af" stroke-width="3"/><rect x="36" y="30" width="22" height="22" rx="4" fill="#D3D1C7" stroke="#6b7280" stroke-width="2"/>'
  }[id];
  return '<svg width="84" height="84" viewBox="0 0 64 64" aria-hidden="true">'+c+'</svg>';
}

/* ---------- ship picture ---------- */
var clipN=0;
function star5(cx,cy,r,f){var p=[];for(var i=0;i<10;i++){var a=(-90+i*36)*Math.PI/180,rr=i%2?r*.45:r;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return '<polygon points="'+p.join(' ')+'" fill="'+f+'"/>'}
function ship(o){
  var P={panels:true,diffuser:true,nose:true,wings:true,stickers:true,lit:false,night:false,wing:'#1D9E75',pat:'chevron',ring:'#EF9F27',deco:['stripes','space'],leds:['#ffffff','#ffffff','#5DCAA5'],name:''};
  for(var k in o)P[k]=o[k];
  var cx=130,yb=210,n=P.night,wd=n?'#3a2e22':WOOD,ws=n?'#8a7457':WS,dim=n?.6:1,g='';
  g+='<rect width="260" height="270" rx="14" fill="'+(n?'#05081a':'#EAF3FB')+'"/>';
  if(n){[[24,30],[230,44],[40,150],[222,160],[200,20],[60,60]].forEach(function(p){g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="1.5" fill="#fff"/>'})}
  g+='<line x1="20" y1="'+(yb+22)+'" x2="240" y2="'+(yb+22)+'" stroke="'+(n?'#4a5170':'#888780')+'" stroke-width=".8"/>';
  var ghost='fill="none" stroke="#6b7ab8" stroke-width="1.2" stroke-dasharray="4 3"';
  var wingL='M'+(cx-22)+' '+(yb-6)+'L'+(cx-56)+' '+(yb+8)+'L'+(cx-20)+' '+(yb-66)+'Z',wingR='M'+(cx+22)+' '+(yb-6)+'L'+(cx+56)+' '+(yb+8)+'L'+(cx+20)+' '+(yb-66)+'Z';
  var body='M'+(cx-24)+' '+yb+'L'+(cx-16)+' '+(yb-110)+'H'+(cx+16)+'L'+(cx+24)+' '+yb+'Z';
  var noseP='M'+(cx-17)+' '+(yb-110)+'Q'+(cx-13)+' '+(yb-150)+' '+cx+' '+(yb-166)+'Q'+(cx+13)+' '+(yb-150)+' '+(cx+17)+' '+(yb-110)+'Z';
  var skirt='M'+(cx-30)+' '+yb+'H'+(cx+30)+'L'+(cx+34)+' '+(yb+22)+'H'+(cx-34)+'Z';
  if(n&&P.lit)g+='<ellipse cx="'+cx+'" cy="'+(yb+23)+'" rx="78" ry="8" fill="#FFE9A0" fill-opacity=".28"/>';
  if(P.wings){[[-1,wingL],[1,wingR]].forEach(function(w){
    g+='<path d="'+w[1]+'" fill="'+P.wing+'" fill-opacity="'+(n?.55:.95)+'" stroke="'+ws+'" stroke-width=".8"/>';
    if(P.stickers&&P.pat){var sg=w[0],id='wc'+(++clipN),x0=cx+sg*20;
      g+='<clipPath id="'+id+'"><path d="'+w[1]+'"/></clipPath><g clip-path="url(#'+id+')" fill-opacity="'+(n?.55:.9)+'" stroke-opacity="'+(n?.55:.9)+'">';
      if(P.pat==='stripes')for(var j=0;j<5;j++)g+='<rect x="'+Math.min(x0,x0+sg*40)+'" y="'+(yb-58+j*13)+'" width="40" height="4" fill="#fff"/>';
      if(P.pat==='dots')for(var j2=0;j2<6;j2++)g+='<circle cx="'+(x0+sg*(8+(j2%2)*12))+'" cy="'+(yb-52+Math.floor(j2/2)*20)+'" r="3.4" fill="#fff"/>';
      if(P.pat==='chevron')for(var j3=0;j3<4;j3++){var y=yb-48+j3*15;g+='<polyline points="'+x0+','+(y+7)+' '+(x0+sg*14)+','+y+' '+(x0+sg*30)+','+(y+7)+'" fill="none" stroke="#fff" stroke-width="2.6"/>'}
      g+='</g>'}
  })}else g+='<path d="'+wingL+'" '+ghost+'/><path d="'+wingR+'" '+ghost+'/>';
  if(P.diffuser){
    g+='<path d="'+skirt+'" fill="'+(n&&P.lit?'#FFD27A':GL)+'" fill-opacity="'+(n&&P.lit?.75:.6)+'" stroke="'+GLS+'" stroke-width=".8"/>';
    g+='<rect x="'+(cx-26)+'" y="'+(yb+5)+'" width="14" height="6" rx="1" fill="#D3D1C7" stroke="#5F5E5A" stroke-width=".5"/>';
    [-4,8,20].forEach(function(dx,i){
      if(P.lit)g+='<circle cx="'+(cx+dx)+'" cy="'+(yb+14)+'" r="11" fill="'+P.leds[i]+'" fill-opacity="'+(n?.4:.3)+'"/>';
      g+='<circle cx="'+(cx+dx)+'" cy="'+(yb+10)+'" r="2.7" fill="'+(P.lit||true?P.leds[i]:'#888')+'" stroke="#5F5E5A" stroke-width=".5"/>'});
  }else g+='<path d="'+skirt+'" '+ghost+'/>';
  if(P.panels){
    g+='<path d="'+body+'" fill="'+wd+'" stroke="'+ws+'" stroke-width=".8"/>';
    if(P.stickers){
      var dc=P.deco;
      if(dc.indexOf('stripes')>=0){g+='<rect x="'+(cx-21)+'" y="'+(yb-40)+'" width="42" height="8" rx="1" fill="#E24B4A" fill-opacity="'+dim+'"/><rect x="'+(cx-21.5)+'" y="'+(yb-30)+'" width="43" height="8" rx="1" fill="#EF9F27" fill-opacity="'+dim+'"/>'}
      if(dc.indexOf('space')>=0){[[-9,-52],[9,-62],[-6,-98],[10,-92]].forEach(function(p){g+=star5(cx+p[0],yb+p[1],4.2,'#EF9F27')});g+='<circle cx="'+(cx-9)+'" cy="'+(yb-20)+'" r="6" fill="#1D9E75" fill-opacity="'+dim+'"/><circle cx="'+(cx+10)+'" cy="'+(yb-18)+'" r="3.4" fill="#7F77DD" fill-opacity="'+dim+'"/>'}
      if(dc.indexOf('bands')>=0){[-48,-36,-24].forEach(function(y,i){g+='<rect x="'+(cx-22)+'" y="'+(yb+y)+'" width="44" height="6" fill="'+(i===1?'#1D9E75':'#5DCAA5')+'" fill-opacity="'+dim+'"/>'})}
    }
    g+='<circle cx="'+cx+'" cy="'+(yb-76)+'" r="10" fill="'+(n&&P.lit?'#FFE9A0':GL)+'" stroke="'+(P.stickers?P.ring:ws)+'" stroke-width="'+(P.stickers?1.8:.8)+'"/>';
  }else g+='<path d="'+body+'" '+ghost+'/>';
  if(P.nose)g+='<path d="'+noseP+'" fill="'+(n&&P.lit?'#FFF1B8':GL)+'" fill-opacity="'+(n&&P.lit?.5:.8)+'" stroke="'+GLS+'" stroke-width=".8"/>';
  else g+='<path d="'+noseP+'" '+ghost+'/>';
  g+='<ellipse cx="'+cx+'" cy="'+yb+'" rx="30" ry="6" fill="'+wd+'" stroke="'+ws+'" stroke-width=".8"/>';
  if(P.name)g+='<text x="130" y="24" font-size="14" text-anchor="middle" font-family="Arial" font-weight="bold" fill="'+(n?'#D3D1C7':'#185FA5')+'">'+esc(P.name)+'</text>';
  return '<svg viewBox="0 0 260 270" role="img" aria-label="Spaceship picture">'+g+'</svg>';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- circuit simulator picture ---------- */
var LEDX=[236,270,304],GAPX=[218,253,287];
function lit(s){var pw=s.cellOk&&s.on;return [0,1,2].map(function(i){return !!(pw&&!s.rev[i]&&!s.loose[i]&&(s.gap===null||i<s.gap))})}
function circuit(s,opt){
  opt=opt||{};var L=lit(s),g='';
  var cols=['#ffffff','#ffffff','#78b7ff'];
  g+='<circle cx="210" cy="125" r="112" fill="'+WOOD+'" stroke="'+WS+'" stroke-width="2"/>';
  g+='<text x="210" y="232" font-size="11" text-anchor="middle" font-family="Arial" fill="#6b5a45">bottom of the base plate</text>';
  g+='<rect x="116" y="94" width="84" height="62" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1.5"/>';
  g+='<circle cx="146" cy="125" r="23" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="146" y="135" font-size="30" font-weight="bold" text-anchor="middle" font-family="Arial" fill="'+(s.cellOk?'#185FA5':'#A32D2D')+'">'+(s.cellOk?'+':'\u2212')+'</text>';
  g+='<rect x="172" y="102" width="24" height="46" rx="6" fill="'+(s.on?'#EF9F27':'#4a4f66')+'" stroke="#222" stroke-width="1.2"/><rect x="175" y="'+(s.on?105:128)+'" width="18" height="17" rx="4" fill="#fff"/>';
  g+='<text x="184" y="'+(s.on?136:117)+'" font-size="9" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#222">'+(s.on?'ON':'OFF')+'</text>';
  g+='<line x1="200" y1="100" x2="206" y2="100" stroke="#D85A30" stroke-width="3"/><line x1="200" y1="150" x2="206" y2="150" stroke="#D85A30" stroke-width="3"/>';
  var gx=s.gap===null?null:GAPX[s.gap];
  if(gx===null)g+='<rect x="206" y="96" width="116" height="9" fill="#D85A30"/>';
  else g+='<rect x="206" y="96" width="'+(gx-6-206)+'" height="9" fill="#D85A30"/><rect x="'+(gx+6)+'" y="96" width="'+(322-gx-6)+'" height="9" fill="#D85A30"/><path d="M'+(gx-5)+' 93L'+(gx+5)+' 108M'+(gx+5)+' 93L'+(gx-5)+' 108" stroke="#333" stroke-width="1.2" opacity=".6"/>';
  g+='<rect x="206" y="145" width="116" height="9" fill="#D85A30"/>';

  }

  return '<svg viewBox="0 0 400 245" role="img" aria-label="Circuit on the base plate" style="width:100%;max-width:560px;margin:0 auto">'+g+'</svg>';
}

/* ---- 2. Circuit Lab ---- */
function runCircuit(l,idx){
  var R=[
    {cellOk:true,on:false,rev:[true,false,true],gap:null,loose:[false,false,false]},
    {cellOk:false,on:true,rev:[false,true,false],gap:null,loose:[false,false,false]},
    {cellOk:false,on:false,rev:[true,true,false],gap:null,loose:[false,false,false]}];
  var r=0,taps=0,faults=0,s;
  function countFaults(x){return (x.cellOk?0:1)+(x.on?0:1)+x.rev.filter(Boolean).length}
  function round(){
    s=JSON.parse(JSON.stringify(R[r]));faults+=countFaults(s);
    stage.innerHTML=progress(R.length,r)+bot('Tap the LEDs, the battery cell and the switch until all 3 lights shine. Remember: the long leg goes to the + rail.')+'<div class="stagebox" id="cv"></div><div class="fb" id="fb"></div><div class="row"><button class="btn small" id="hint">Hint</button></div>';
    draw();$('#hint').onclick=hint;
  }
  function draw(hl){
    var L=lit(s),n=L.filter(Boolean).length;
    $('#cv').innerHTML=circuit(s,{tap:true,hl:hl});
    $('#fb').className='fb'+(n===3?' good':'');$('#fb').innerHTML=n===3?'<b>All 3 lights shine!</b>':'Lights on: <b>'+n+' of 3</b>';
    $$('.hit').forEach(function(h){h.onclick=function(){
      var a=h.getAttribute('data-act');taps++;
      if(a==='cell')s.cellOk=!s.cellOk;if(a==='sw')s.on=!s.on;if(a==='led'){var i=+h.getAttribute('data-i');s.rev[i]=!s.rev[i]}
      draw();
      if(lit(s).every(Boolean)){
        $$('.hit').forEach(function(x){x.onclick=null});
        var nx=document.createElement('button');nx.className='btn primary';nx.textContent=r===R.length-1?'Finish':'Next circuit';
        nx.onclick=function(){r++;if(r<R.length)round();else finish(l,idx,Math.max(0,taps-faults),[1,4],'Polarity matters! An LED only shines when its long leg is on the + side, the cell faces the right way and the switch is ON.')};
        $('.row').appendChild(nx);
      }
    }});
  }
  function hint(){
    var h=[];
    if(!s.on)h.push({x:170,y:98,w:30,h:54});else if(!s.cellOk)h.push({x:116,y:94,w:60,h:62});
    else for(var i=0;i<3;i++)if(s.rev[i]){h.push({x:LEDX[i]-18,y:88,w:36,h:74});break}
    draw(h);
    var m=!s.on?'Is the switch ON?':!s.cellOk?'The cell shows a minus. Flip it so it shows +.':'This LED is backwards. The long leg must touch the + rail on top.';
    $('#fb').innerHTML='<b>Hint:</b> '+m;
  }
  round();
}

/* ---- 3. Bug Hunter ---- */
var CHECKS=[{id:'cell',n:'Battery cell'},{id:'sw',n:'Switch'},{id:'dir',n:'LED direction'},{id:'tape',n:'Copper tape'},{id:'leg',n:'LED legs'}];
function runBug(l,idx){
  var kinds=shuffle(['cell','sw','dir','tape','leg']).slice(0,4),r=0,wrong=0,s,fault,found;
  function make(k){
    var x={cellOk:true,on:true,rev:[false,false,false],gap:null,loose:[false,false,false]},i=Math.floor(Math.random()*3);
    if(k==='cell')x.cellOk=false;if(k==='sw')x.on=false;if(k==='dir')x.rev[i]=true;if(k==='leg')x.loose[i]=true;
    if(k==='tape')x.gap=1+Math.floor(Math.random()*2);
    return {s:x,i:i,k:k};
  }
  function dark(x){var d=[];lit(x).forEach(function(v,i){if(!v)d.push(i+1)});return d}
  function observe(x){var d=dark(x);return d.length===3?'All 3 lights are dark. Which part feeds all of them?':d.length===1?'Only light '+d[0]+' is dark. The others work, so the problem is local.':'Light 1 shines but lights '+d.join(' and ')+' are dark. Look along the rails.'}
  function steps(a){return '<div class="steps">'+['Observe','Guess','Check','Fix','Test again'].map(function(t,i){return '<span class="'+(i===a?'on':'')+'">'+t+'</span>'}).join('')+'</div>'}
  function region(k){
    if(k==='cell')return {x:116,y:94,w:60,h:62};if(k==='sw')return {x:170,y:98,w:30,h:54};
    if(k==='dir'||k==='leg')return fault.k===k?{x:LEDX[fault.i]-18,y:88,w:36,h:74}:{x:LEDX[0]-18,y:88,w:LEDX[2]-LEDX[0]+36,h:74};
    return fault.k==='tape'?{x:GAPX[s.gap]-14,y:88,w:28,h:26}:{x:206,y:92,w:116,h:66};
  }
  function round(){
    var f=make(kinds[r]);fault=f;s=f.s;found=false;
    stage.innerHTML=progress(kinds.length,r)+'<div id="st"></div>'+bot(observe(s))+'<div class="stagebox" id="cv">'+circuit(s)+'</div><div class="fb" id="fb">Which part do you want to check?</div><div class="machines" id="chk">'+CHECKS.map(function(c){return '<button class="mach" style="min-height:64px" data-k="'+c.id+'">'+c.n+'</button>'}).join('')+'</div><div class="row"><button class="btn ok" id="fix" hidden>Fix it!</button><button class="btn primary" id="nx" hidden></button></div>';
    $('#st').innerHTML=steps(1);
    $$('#chk .mach').forEach(function(b){b.onclick=function(){
      if(found)return;var k=b.getAttribute('data-k');$('#st').innerHTML=steps(2);
      var hit=(k===fault.k),h=region(k);h.ok=!hit;
      $('#cv').innerHTML=circuit(s,{hl:[h]});
      var fb=$('#fb');
      if(hit){found=true;b.className='mach good';fb.className='fb good';fb.innerHTML='<b>Found it!</b> '+detail(fault);$('#fix').hidden=false;$('#st').innerHTML=steps(3)}
      else{wrong++;b.className='mach bad';fb.className='fb bad';fb.innerHTML='This part looks fine. Pick another one.'+(wrong>=3?' Tip: check the easy things first!':'')}
    }});
    $('#fix').onclick=function(){
      var x=s;if(fault.k==='cell')x.cellOk=true;if(fault.k==='sw')x.on=true;if(fault.k==='dir')x.rev[fault.i]=false;if(fault.k==='leg')x.loose[fault.i]=false;if(fault.k==='tape')x.gap=null;
      $('#cv').innerHTML=circuit(x);$('#st').innerHTML=steps(4);$('#fix').hidden=true;
      $('#fb').className='fb good';$('#fb').innerHTML='<b>Test again:</b> all 3 lights shine!';
      var nx=$('#nx');nx.hidden=false;nx.textContent=r===kinds.length-1?'Finish':'Next ship';
      nx.onclick=function(){r++;if(r<kinds.length)round();else finish(l,idx,wrong,[2,6],'You used the loop: Observe, Guess, Check, Fix, Test again. Real engineers do exactly this!')};
    };
  }
  function detail(f){return {cell:'The cell was upside down: it showed a minus.',sw:'The switch was OFF!',dir:'LED '+(f.i+1)+' was backwards. Long leg must touch +.',tape:'The copper tape had a gap, so the lights after it had no power.',leg:'LED '+(f.i+1)+' had a leg lifted off the tape.'}[f.k]}
  round();
}

/* ---- 4. Tolerance Lab ---- */
function runFit(l,idx){
  var R=[{tab:3.00,ply:'Birch plywood, batch A'},{tab:3.08,ply:'Birch plywood, batch B'},{tab:2.95,ply:'Birch plywood, batch C'}];
  var SL=[3.00,3.05,3.10,3.15,3.20,3.25,3.30],r=0,tries=0,done;
  function fit(tab,slot){var g=Math.round((slot-tab)*100)/100;return g<0.03?'tight':g<=0.12?'good':'loose'}
  function pic(tab,slot,res){
    var S=100,tw=tab*S,sw=slot*S,x0=210-sw/2,tx=210-tw/2;
    var anim=res==='tight'?'translate(0,-46px)':res==='loose'?'translate(0,0) rotate(5deg)':'translate(0,0)';
    var g='<rect x="10" y="150" width="'+(x0-10)+'" height="56" fill="'+WOOD+'" stroke="'+WS+'" stroke-width="2"/><rect x="'+(x0+sw)+'" y="150" width="'+(400-x0-sw)+'" height="56" fill="'+WOOD+'" stroke="'+WS+'" stroke-width="2"/>';
    g+='<g class="tabslide" id="tabg" style="transform-box:fill-box;transform-origin:50% 100%;transform:'+(res?anim:'translate(0,-70px)')+'"><rect x="'+tx+'" y="-420" width="'+tw+'" height="584" fill="'+WOOD+'" stroke="'+WS+'" stroke-width="2"/></g>';
    g+='<text x="210" y="228" font-size="14" text-anchor="middle" font-family="Arial" fill="#a9b3d9">tab '+tab.toFixed(2)+' mm   slot '+(slot?slot.toFixed(2):'?')+' mm</text>';
    return '<svg viewBox="0 -90 420 330" role="img" aria-label="A wooden tab and a slot, drawn very large" style="width:100%;max-width:560px;margin:0 auto">'+g+'</svg>';
  }
  function round(){
    var rd=R[r];done=false;
    stage.innerHTML=progress(R.length,r)+bot('This is '+rd.ply+'. Its tab is <b>'+rd.tab.toFixed(2)+' mm</b> thick. Pick a slot width. A perfect "kid-fit" slides in by hand, with no force and no wobble.')+'<div class="stagebox" id="cv">'+pic(rd.tab,0,null)+'</div><div class="fb" id="fb">Choose a slot width.</div><div class="opts" id="o">'+SL.map(function(v){return '<button class="opt" data-v="'+v.toFixed(2)+'">'+v.toFixed(2)+' mm</button>'}).join('')+'</div><div class="row"><button class="btn primary" id="nx" hidden>'+(r===R.length-1?'Finish':'Next plywood')+'</button></div>';
    $$('.opt').forEach(function(b){b.onclick=function(){
      if(done)return;tries++;var v=+b.getAttribute('data-v'),res=fit(rd.tab,v);
      $('#cv').innerHTML=pic(rd.tab,v,null);
      var el=$('#tabg');void el.getBoundingClientRect();
      setTimeout(function(){el.style.transform=res==='tight'?'translate(0,-46px)':res==='loose'?'rotate(5deg)':'translate(0,0)'},30);
      var gap=Math.round((v-rd.tab)*100)/100,fb=$('#fb');
      if(res==='good'){done=true;b.className='opt good';fb.className='fb good';fb.innerHTML='<b>Perfect kid-fit!</b> Gap = '+v.toFixed(2)+' \u2212 '+rd.tab.toFixed(2)+' = '+gap.toFixed(2)+' mm.';$('#nx').hidden=false}
      else{b.className='opt bad';fb.className='fb bad';fb.innerHTML=res==='tight'?'<b>Too tight!</b> Gap = '+gap.toFixed(2)+' mm. It will not go in. Pick a wider slot.':'<b>Too loose!</b> Gap = '+gap.toFixed(2)+' mm. It wobbles. Pick a narrower slot.'}
    }});
    $('#nx').onclick=function(){r++;if(r<R.length)round();else finish(l,idx,Math.max(0,tries-R.length),[1,4],'Every plywood sheet is a little different, so FabLab people run a comb test: cut many slot sizes and find the one that fits best. In this game the numbers are made up. Real numbers come from real tests!')};
  }
  round();
}

var ORDER=[
 {n:'Put the stickers on the flat panels and wings',w:'Flat parts are easiest to decorate. Do it before anything is built.',no:'Not yet: stickers go on while the parts are still flat.',ico:'stickers'},
 {n:'Stick the 2 copper rails on the plate',w:'The rails are the road for the electricity.',no:'The rails come before the LEDs, because the LEDs sit on them.',ico:'rails'},
 {n:'Place the 3 LEDs on the rails',w:'Long leg to +, short leg to the minus rail.',no:'The LEDs need the rails first.',ico:'led'},
 {n:'Insert the cell, switch ON and test',w:'Test the electronics before building the body. Easy to fix!',no:'Test needs the LEDs on the rails first.',ico:'led'},
 {n:'Stand the 3 panels in the plate slots',w:'Press-fit: no glue, just push the tabs in.',no:'Finish and test the electronics first. Then build the body.',ico:'panels'},
 {n:'Put the plate into the exhaust diffuser',w:'The LEDs now face down into the diffuser and make it glow.',no:'The body panels come first.',ico:'diffuser'},
 {n:'Put the nose cone on top of the panels',w:'It locks the tops of the three panels together.',no:'The nose cone comes after the panels are standing.',ico:'nose'},
 {n:'Clip the 3 wings into the short slots',w:'Wings go last so they do not get bent.',no:'Wings go in last, once the ship is built.',ico:'wings'}

function runOrder(l,idx){

  function round(){
    var opts=[ORDER[i]];var rest=shuffle(ORDER.filter(function(o,j){return j>i}).concat(ORDER.filter(function(o,j){return j<i&&false})));
    for(var q=0;q<rest.length&&opts.length<3;q++)opts.push(rest[q]);
    if(opts.length<3){var other=shuffle(ORDER.filter(function(o,j){return j<i}));for(var z=0;z<other.length&&opts.length<3;z++)opts.push(other[z])}

    }});
    $('#nx').onclick=function(){i++;if(i<ORDER.length)round();else finish(l,idx,mist,[2,6],'Build the flat parts first, test the electronics, then build the body. Your lab team may test other orders in the real class!')};

    '<label class="f">Window sticker</label>'+chips(RINGS,'ring',function(c){return c[0]===S.ring})+
    '<label class="f">Wing sticker</label>'+chips(WINGS.map(function(w){return [w[0],w[2]]}),'pat',function(c){return c[0]===S.pat})+
    '<label class="f">Body stickers</label>'+chips(DECOS,'deco',function(c){return c[0]===S.deco})+
    '<label class="f">Third LED color</label>'+chips(LEDS,'led3',function(c){return c[0]===S.led3})+
    '</div></div>'+
    '<div class="card" style="margin-top:16px"><b>Power Lab</b> (game numbers)<label class="f">Number of LEDs: <b id="nn">'+S.n+'</b></label><input type="range" id="rg" min="1" max="5" step="1" value="'+S.n+'"><div class="meter"><i style="width:'+Math.min(100,hours*3)+'%"></i></div><div>The cell lasts about <b>'+hours+' hours</b>. More LEDs shine brighter but drain the cell faster. Real numbers are measured in the lab.</div></div>'+
    '<div class="card" style="margin-top:16px"><b>Made in the IdeaLab FabLab</b><div class="madein" style="margin-top:8px"><div><b>7</b>laser-cut parts</div><div><b>2</b>3D-printed parts</div><div><b>1</b>copper rail set</div><div><b>1</b>sticker sheet</div><div><b>You</b>built the circuit</div></div></div>'+
    '<div class="card" style="margin-top:16px"><b>Next mission</b><div>Mission 02 is <b>Modify</b>: design your own wing and cut it on the laser. Ask your teacher!</div><div class="row"><button class="btn ok" id="fin">Complete mission</button></div></div>';
    $('#tg').onclick=function(){S.night=!S.night;draw()};
    $('#nm').oninput=function(){S.name=this.value;$('#pic').innerHTML=pic()};
    $('#rg').oninput=function(){S.n=+this.value;var sc=window.scrollY;draw();window.scrollTo(0,sc)};
    $$('.chip').forEach(function(c){c.onclick=function(){var k=c.getAttribute('data-k'),i=+c.getAttribute('data-i');
      if(k==='ring')S.ring=RINGS[i][0];if(k==='pat'){S.pat=WINGS[i][0];S.wing=WINGS[i][1]}if(k==='deco')S.deco=DECOS[i][0];if(k==='led3')S.led3=LEDS[i][0];
      var sc=window.scrollY;draw();window.scrollTo(0,sc)}});
    $('#fin').onclick=function(){finish(l,idx,0,[0,0],'Mission 01 complete! You know the machines, the circuit, the fit and the build order. Next up: design your own part!')};
  }
  draw();
}

updateTotal();goHome();
})();
</script>
</body>
</html>
