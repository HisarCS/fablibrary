site_name: FabLibrary – Hisar FabLab
site_url: https://hisarcs.github.io/fablibrary/
repo_url: https://github.com/HisarCS/fablibrary
edit_uri: edit/main/docs/
copyright: Designs CC BY-SA 4.0 · Code MIT
hooks:
  - hooks/copy_assets.py
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
plugins:
  - search
  - glightbox
nav:
  - Home: index.md
  - Welcome Space:
      - Overview: projects/welcome-space/index.md
      - Parts and files: projects/welcome-space/parts.md
      - Kit list: projects/welcome-space/kit-list.md
      - Electronics: projects/welcome-space/electronics.md
      - Assembly: projects/welcome-space/assembly.md
      - 3D explorer: projects/welcome-space/explore-3d.md
      - Model A or B: projects/welcome-space/models.md
      - Lesson plan: projects/welcome-space/lesson.md
      - Test plan: projects/welcome-space/test-plan.md
      - First week: projects/welcome-space/first-week.md
      - Assumptions: projects/welcome-space/assumptions.md
      - Safety: projects/welcome-space/safety.md
      - Pilot: projects/welcome-space/pilot.md
      - Play: projects/welcome-space/play.md
      - "Mission: for students": projects/welcome-space/mission.md
  - Contribute: contribute.md
