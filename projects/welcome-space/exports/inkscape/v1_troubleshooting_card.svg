<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns="http://www.w3.org/2000/svg" width="148mm" height="105mm" viewBox="0 0 148 105">
<sodipodi:namedview id="base" inkscape:document-units="mm" units="mm" showgrid="false"/>
<rect width="148" height="105" rx="4" fill="#ffffff" stroke="#888780" stroke-width=".4"/>
<text x="8" y="14" font-size="7" font-family="Arial" font-weight="bold" fill="#185FA5">Light not on? Be a Bug Hunter!</text>
<circle cx="14" cy="28" r="4.6" fill="#185FA5"/><text x="14" y="29.6" font-size="5" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#ffffff">1</text><text x="24" y="27" font-size="4.4" font-family="Arial" font-weight="bold" fill="#222">Battery</text><text x="24" y="32.4" font-size="3.6" font-family="Arial" fill="#444">Is the cell in, with the + side up? Is it fresh?</text>
<circle cx="14" cy="42" r="4.6" fill="#185FA5"/><text x="14" y="43.6" font-size="5" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#ffffff">2</text><text x="24" y="41" font-size="4.4" font-family="Arial" font-weight="bold" fill="#222">Switch</text><text x="24" y="46.4" font-size="3.6" font-family="Arial" fill="#444">Is the switch ON?</text>
<circle cx="14" cy="56" r="4.6" fill="#185FA5"/><text x="14" y="57.6" font-size="5" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#ffffff">3</text><text x="24" y="55" font-size="4.4" font-family="Arial" font-weight="bold" fill="#222">LED direction</text><text x="24" y="60.4" font-size="3.6" font-family="Arial" fill="#444">Long leg to the + rail, short leg to the - rail.</text>
<circle cx="14" cy="70" r="4.6" fill="#185FA5"/><text x="14" y="71.6" font-size="5" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#ffffff">4</text><text x="24" y="69" font-size="4.4" font-family="Arial" font-weight="bold" fill="#222">Copper tape</text><text x="24" y="74.4" font-size="3.6" font-family="Arial" fill="#444">Is the tape flat and touching at both ends?</text>
<circle cx="14" cy="84" r="4.6" fill="#185FA5"/><text x="14" y="85.6" font-size="5" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#ffffff">5</text><text x="24" y="83" font-size="4.4" font-family="Arial" font-weight="bold" fill="#222">LED legs</text><text x="24" y="88.4" font-size="3.6" font-family="Arial" fill="#444">Does each leg touch the tape under its patch?</text>
<rect x="8" y="94" width="132" height="8" rx="2" fill="#EAF3FB"/><text x="74" y="99.4" font-size="4" text-anchor="middle" font-family="Arial" fill="#185FA5">Observe &#8594; Guess &#8594; Check &#8594; Fix &#8594; Test again</text>
</svg>
