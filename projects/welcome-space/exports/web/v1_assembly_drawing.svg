<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="250mm" height="270mm" viewBox="0 0 250 270">
<rect id="preview-bg" x="0" y="0" width="250" height="270" fill="#ffffff"/>
<rect width="250" height="270" fill="#fff"/>
<text x="8" y="10" font-size="5" text-anchor="start" font-family="Arial" fill="#222" font-weight="bold">v1 spaceship - exploded assembly and student sequence</text>
<line x1="70" y1="18" x2="70" y2="258" stroke="#999" stroke-width="0.6" stroke-dasharray="3 2"/>
<path d="M47 62 Q48 30 70 20 Q92 30 93 62 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.6"/><circle cx="104" cy="40" r="3.6" fill="#185FA5"/><text x="104" y="41.3" font-size="3.4" text-anchor="middle" font-family="Arial" fill="#fff" font-weight="bold">6</text>
<polygon points="62,180 62,80 78,80 100,150 100,180" fill="#E8CFA3" stroke="#8A6A3C" stroke-width="0.6"/><polygon points="62,180 62,80 40,150 40,180" fill="#D9BC8C" stroke="#8A6A3C" stroke-width="0.6"/><circle cx="82" cy="128" r="7" fill="#B5D4F4" stroke="#8A6A3C" stroke-width="0.6"/><circle cx="110" cy="120" r="3.6" fill="#185FA5"/><text x="110" y="121.3" font-size="3.4" text-anchor="middle" font-family="Arial" fill="#fff" font-weight="bold">4</text>
<polygon points="115,200 115,160 130,160 150,205 150,212 140,212 140,200" fill="#378ADD" stroke="#0C447C" stroke-width="0.6"/><circle cx="160" cy="185" r="3.6" fill="#185FA5"/><text x="160" y="186.3" font-size="3.4" text-anchor="middle" font-family="Arial" fill="#fff" font-weight="bold">7</text>
<ellipse cx="70" cy="220" rx="55" ry="8" fill="#E8CFA3" stroke="#8A6A3C" stroke-width="0.6"/><rect x="35" y="228" width="22" height="5" fill="#D3D1C7" stroke="#555" stroke-width="0.6"/><circle cx="70" cy="231" r="2.2" fill="#fff" stroke="#555" stroke-width="0.6"/><circle cx="82" cy="231" r="2.2" fill="#fff" stroke="#555" stroke-width="0.6"/><circle cx="94" cy="231" r="2.2" fill="#fff" stroke="#555" stroke-width="0.6"/><rect x="65" y="226" width="34" height="1.5" fill="#D85A30"/><circle cx="134" cy="222" r="3.6" fill="#185FA5"/><text x="134" y="223.3" font-size="3.4" text-anchor="middle" font-family="Arial" fill="#fff" font-weight="bold">2</text>
<path d="M12 240 H128 L132 258 H8 Z" fill="#B5D4F4" fill-opacity="0.7" stroke="#185FA5" stroke-width="0.6"/><circle cx="140" cy="250" r="3.6" fill="#185FA5"/><text x="140" y="251.3" font-size="3.4" text-anchor="middle" font-family="Arial" fill="#fff" font-weight="bold">5</text>
<text x="70" y="266" font-size="3" text-anchor="middle" font-family="Arial" fill="#555">electronics are UNDER the plate, facing into the diffuser</text>
<circle cx="150" cy="22.8" r="3.6" fill="#185FA5"/><text x="150" y="24.1" font-size="3.4" text-anchor="middle" font-family="Arial" fill="#fff" font-weight="bold">1</text>
<text x="156" y="24" font-size="3.2" text-anchor="start" font-family="Arial" fill="#222">Stickers: on panels and wings while flat</text>
<circle cx="150" cy="31.3" r="3.6" fill="#185FA5"/><text x="150" y="32.6" font-size="3.4" text-anchor="middle" font-family="Arial" fill="#fff" font-weight="bold">2</text>
<text x="156" y="32.5" font-size="3.2" text-anchor="start" font-family="Arial" fill="#222">Electronics: plate upside down (bottom face up)</text>
<text x="156" y="38.0" font-size="3.2" text-anchor="start" font-family="Arial" fill="#222">holder + 2 copper rails + 3 LEDs (sandwich)</text>
<circle cx="150" cy="45.3" r="3.6" fill="#185FA5"/><text x="150" y="46.599999999999994" font-size="3.4" text-anchor="middle" font-family="Arial" fill="#fff" font-weight="bold">3</text>
<text x="156" y="46.5" font-size="3.2" text-anchor="start" font-family="Arial" fill="#222">Test: insert battery, ON. Do all 3 LEDs light?</text>
<text x="156" y="52.0" font-size="3.2" text-anchor="start" font-family="Arial" fill="#222">if not: battery > switch > LED direction ></text>
<text x="156" y="57.5" font-size="3.2" text-anchor="start" font-family="Arial" fill="#222">tape contact > LED leg contact</text>
<circle cx="150" cy="64.8" r="3.6" fill="#185FA5"/><text x="150" y="66.1" font-size="3.4" text-anchor="middle" font-family="Arial" fill="#fff" font-weight="bold">4</text>
<text x="156" y="66.0" font-size="3.2" text-anchor="start" font-family="Arial" fill="#222">Panels x3: into the top face of the plate,</text>
<text x="156" y="71.5" font-size="3.2" text-anchor="start" font-family="Arial" fill="#222">into the long slots (28 mm)</text>
<circle cx="150" cy="78.8" r="3.6" fill="#185FA5"/><text x="150" y="80.1" font-size="3.4" text-anchor="middle" font-family="Arial" fill="#fff" font-weight="bold">5</text>
<text x="156" y="80.0" font-size="3.2" text-anchor="start" font-family="Arial" fill="#222">Plate into diffuser: electronics facing down</text>
<circle cx="150" cy="87.3" r="3.6" fill="#185FA5"/><text x="150" y="88.6" font-size="3.4" text-anchor="middle" font-family="Arial" fill="#fff" font-weight="bold">6</text>
<text x="156" y="88.5" font-size="3.2" text-anchor="start" font-family="Arial" fill="#222">Nose cone: onto the top tabs of the 3 panels</text>
<circle cx="150" cy="95.8" r="3.6" fill="#185FA5"/><text x="150" y="97.1" font-size="3.4" text-anchor="middle" font-family="Arial" fill="#fff" font-weight="bold">7</text>
<text x="156" y="97.0" font-size="3.2" text-anchor="start" font-family="Arial" fill="#222">Wings x3: into the short slots (20 mm)</text>
<circle cx="150" cy="104.3" r="3.6" fill="#185FA5"/><text x="150" y="105.6" font-size="3.4" text-anchor="middle" font-family="Arial" fill="#fff" font-weight="bold">8</text>
<text x="156" y="105.5" font-size="3.2" text-anchor="start" font-family="Arial" fill="#222">Dark room: ON and final test</text>
<text x="150" y="117.0" font-size="3" text-anchor="start" font-family="Arial" fill="#555">Note: order of steps 4-5-6 to be tested in pilot.</text>
<text x="150" y="122.0" font-size="3" text-anchor="start" font-family="Arial" fill="#555">Alternative: panels into nose cone first,</text>
<text x="150" y="127.0" font-size="3" text-anchor="start" font-family="Arial" fill="#555">then everything into the plate.</text>
</svg>
